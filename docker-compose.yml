services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.softwaretest-web.rule=Host(`testing.mercantec.tech`)
      - traefik.http.routers.softwaretest-web.entrypoints=websecure
      - traefik.http.routers.softwaretest-web.tls=true
      - traefik.http.services.softwaretest-web.loadbalancer.server.port=3000

networks:
  default:
    driver: bridge
  dokploy-network:
    external: true
